<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axion</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#fff;color:#111;padding:2.5rem 1.5rem;font-size:14px;line-height:1.6}
.wrap{max-width:480px;margin:0 auto}

h1{font-size:18px;font-weight:600;margin-bottom:1.8rem;color:#111}

.section{margin-bottom:1.4rem}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#999;margin-bottom:8px;display:block}

/* model select */
.mlist{display:flex;flex-direction:column;gap:4px}
.mbtn{width:100%;padding:9px 12px;border:1px solid #e5e5e5;border-radius:8px;background:#fff;text-align:left;font-family:inherit;font-size:13px;cursor:pointer;color:#444;transition:border-color .12s,background .12s;display:flex;justify-content:space-between;align-items:center}
.mbtn:hover{border-color:#bbb}
.mbtn.sel{border-color:#1a6ef5;background:#f0f6ff;color:#111;font-weight:500}
.mbtn .tag{font-size:11px;color:#999;font-weight:400}
.mbtn.sel .tag{color:#1a6ef5}

/* style select */
.slist{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{padding:6px 12px;border:1px solid #e5e5e5;border-radius:20px;background:#fff;font-family:inherit;font-size:12px;cursor:pointer;color:#444;transition:all .12s}
.sbtn:hover{border-color:#bbb}
.sbtn.sel{border-color:#1a6ef5;background:#1a6ef5;color:#fff}

/* key input */
.krow{display:flex;gap:6px}
.kinput{flex:1;padding:9px 11px;border:1px solid #e5e5e5;border-radius:8px;font-size:13px;font-family:'DM Mono',monospace;color:#111;background:#fff;outline:none;transition:border-color .12s}
.kinput:focus{border-color:#1a6ef5}
.kinput.ok{border-color:#22c55e;background:#f0fdf4}

/* generate button */
.genbtn{width:100%;padding:11px;background:#111;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s;margin-top:.4rem}
.genbtn:hover{background:#333}

/* result */
.result{margin-top:1.2rem;display:none}
.rrow{display:flex;justify-content:center;margin-top:8px}
.rbtn.blue{width:100%;padding:12px;background:#1a6ef5;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s}
.rbtn.blue:hover{background:#1558c0}

.err{font-size:12px;color:#dc2626;margin-top:6px;display:none}

/* toast */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(4px);background:#111;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* footer copyright */
.footer{margin-top:2.5rem;text-align:center;font-size:11px;color:#aaa;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">

<h1>Axion</h1>

<!-- 모델 -->
<div class="section">
  <span class="label">모델</span>
  <div class="mlist" id="mg"></div>
</div>

<!-- 답변 스타일 -->
<div class="section">
  <span class="label">답변 스타일</span>
  <div class="slist" id="sl"></div>
</div>

<!-- API 키 -->
<div class="section">
  <span class="label" id="klabel">API 키</span>
  <div class="krow">
    <input class="kinput" type="password" id="ki" autocomplete="off" spellcheck="false" placeholder="AIzaSy...">
  </div>
  <div class="err" id="em"></div>
</div>

<button class="genbtn" onclick="generate()">북마클릿 생성</button>

<div class="result" id="result">
  <div class="rrow">
    <button class="rbtn blue" onclick="doCopy()">북마클릿 코드 복사하기</button>
  </div>
</div>

<!-- 카피라이트 -->
<div class="footer">
  &copy; 시형
</div>

</div>
<div class="toast" id="toast"></div>

<script>
var MODELS = [
  {id:"gemini-2.0-flash",      name:"Gemini 2.0 Flash",      tag:"무료 1500/일", prov:"gemini"},
  {id:"gemini-2.5-flash-lite", name:"Gemini 2.5 Flash-Lite", tag:"무료 1000/일", prov:"gemini"},
  {id:"gemini-2.5-flash",      name:"Gemini 2.5 Flash",      tag:"무료 250/일",  prov:"gemini"},
  {id:"gemini-2.5-pro",        name:"Gemini 2.5 Pro",        tag:"무료 100/일",  prov:"gemini"},
  {id:"gpt-4o-mini",           name:"GPT-4o mini",           tag:"유료",         prov:"openai"},
  {id:"gpt-4o",                name:"GPT-4o",                tag:"유료",         prov:"openai"},
  {id:"gpt-4.1-mini",          name:"GPT-4.1 mini",          tag:"유료",         prov:"openai"},
  {id:"gpt-4.1",               name:"GPT-4.1",               tag:"유료",         prov:"openai"},
];

var STYLES = [
  {id:"quick",    label:"답만",      sys:"문제의 최종 답만 한 줄로 말해줘. 풀이 과정 없이 답만."},
  {id:"simple",   label:"간단 풀이", sys:"문제를 풀어줘. 핵심 풀이 과정과 답을 간결하게 설명해줘."},
  {id:"detailed", label:"자세한 풀이",sys:"문제를 풀어줘. 풀이 과정을 단계별로 자세하게 설명하고 최종 답을 명확히 제시해줘."},
];

var selModel = "gemini-2.0-flash";
var selStyle = "simple";
var savedKeys = {};
var currentGeneratedBm = "";

try {
  var raw = localStorage.getItem("ai_bm_keys");
  if (raw) savedKeys = JSON.parse(raw);
} catch(e) {}

function saveKeys() {
  try { localStorage.setItem("ai_bm_keys", JSON.stringify(savedKeys)); } catch(e) {}
}

function gm(id){ return MODELS.find(function(m){return m.id===id;}); }

function renderModels(){
  var g = document.getElementById("mg"); g.innerHTML = "";
  MODELS.forEach(function(m){
    var b = document.createElement("button");
    b.className = "mbtn" + (m.id===selModel?" sel":"");
    b.innerHTML = m.name + "<span class=\"tag\">" + m.tag + "</span>";
    b.onclick = function(){ pickModel(m.id); };
    g.appendChild(b);
  });
}

function renderStyles(){
  var s = document.getElementById("sl"); s.innerHTML = "";
  STYLES.forEach(function(st){
    var b = document.createElement("button");
    b.className = "sbtn" + (st.id===selStyle?" sel":"");
    b.textContent = st.label;
    b.onclick = function(){ selStyle=st.id; renderStyles(); };
    s.appendChild(b);
  });
}

function pickModel(id){
  var cur = document.getElementById("ki").value.trim();
  if(cur) { savedKeys[selModel]=cur; saveKeys(); }
  selModel = id;
  renderModels();
  var m = gm(id);
  document.getElementById("klabel").textContent = m.prov==="gemini" ? "Gemini API 키" : "OpenAI API 키";
  document.getElementById("ki").placeholder = m.prov==="gemini" ? "AIzaSy..." : "sk-proj-...";
  var inp = document.getElementById("ki");
  inp.value = savedKeys[id] || "";
  updateKS();
  document.getElementById("result").style.display = "none";
  document.getElementById("em").style.display = "none";
}

function updateKS(){
  var i = document.getElementById("ki");
  if(i.value.trim()) i.classList.add("ok"); else i.classList.remove("ok");
}

function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},2000);
}

function doCopy(){
  if(!currentGeneratedBm) return;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(currentGeneratedBm).then(function(){showToast("코드가 복사되었습니다.");});
  } else {
    var t = document.createElement("textarea");
    t.value = currentGeneratedBm; document.body.appendChild(t); t.select();
    document.execCommand("copy"); document.body.removeChild(t);
    showToast("코드가 복사되었습니다.");
  }
}

function generate(){
  document.getElementById("em").style.display="none";
  var key=document.getElementById("ki").value.trim();
  var m=gm(selModel);
  if(!key){showErr("API 키를 입력하세요.");return;}
  if(m.prov==="gemini"&&!key.startsWith("AIza")){showErr("Gemini 키는 AIzaSy... 형식이어야 합니다.");return;}
  if(m.prov==="openai"&&!key.startsWith("sk-")){showErr("OpenAI 키는 sk-... 형식이어야 합니다.");return;}
  savedKeys[selModel]=key; saveKeys();
  var styleObj = STYLES.find(function(s){return s.id===selStyle;});
  var bm=makeBM(key,selModel,m.prov,styleObj.sys);
  
  currentGeneratedBm = bm;
  document.getElementById("result").style.display = "block";
}

function showErr(msg){var e=document.getElementById("em");e.textContent=msg;e.style.display="block";}

function makeBM(key,model,prov,sysprompt){
  var K=JSON.stringify(key);
  var M=JSON.stringify(model);
  var P=JSON.stringify(prov);
  var SYS=JSON.stringify(sysprompt);

  var src=[
    "if(window.__aiOn){",
      "var x=document.getElementById('__aiPn');",
      "if(x){x.style.transform='translateX(100%)';setTimeout(function(){x.remove();},300);}",
      "window.__aiOn=false;return;",
    "}",
    "window.__aiOn=true;",
    "var K="+K+",M="+M+",P="+P+",SYS="+SYS+";",
    "var H=[];",
    
    "try{",
      "var rawH=localStorage.getItem('__ai_hist_'+M);",
      "if(rawH){H=JSON.parse(rawH);}",
    "}catch(e){}",

    "var pn=document.createElement('div');pn.id='__aiPn';",
    "pn.style.cssText='position:fixed;top:0;right:0;width:340px;height:100vh;background:#fff;",
      "color:#111;font-family:system-ui,sans-serif;font-size:13px;z-index:2147483647;",
      "display:flex;flex-direction:column;border-left:1px solid #e5e5e5;box-sizing:border-box;",
      "transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);",
      "box-shadow:-2px 0 12px rgba(0,0,0,.06)';",
    "document.body.appendChild(pn);",
    "requestAnimationFrame(function(){pn.style.transform='translateX(0)';});",

    "var hd=document.createElement('div');",
    "hd.style.cssText='padding:11px 14px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;flex-shrink:0';",
    "var hn=document.createElement('span');hn.style.cssText='font-weight:600;font-size:13px';hn.textContent='Axion';",
    "var hb=document.createElement('span');hb.style.cssText='font-size:11px;color:#999;margin-left:6px';hb.textContent=M;",
    "var htw=document.createElement('div');htw.appendChild(hn);htw.appendChild(hb);",
    
    "var rstBtn=document.createElement('button');rstBtn.textContent='초기화';",
    "rstBtn.style.cssText='background:none;border:none;color:#dc2626;font-size:11px;cursor:pointer;margin-left:auto;margin-right:12px;font-family:inherit';",
    
    "var xBtn=document.createElement('button');xBtn.innerHTML='&times;';",
    "xBtn.style.cssText='background:none;border:none;color:#999;font-size:18px;cursor:pointer;padding:0 2px;line-height:1';",
    "hd.appendChild(htw);hd.appendChild(rstBtn);hd.appendChild(xBtn);pn.appendChild(hd);",

    "var lg=document.createElement('div');lg.id='__aiLg';",
    "lg.style.cssText='flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px';",
    "pn.appendChild(lg);",

    "var ft=document.createElement('div');",
    "ft.style.cssText='padding:10px 12px;border-top:1px solid #e5e5e5;flex-shrink:0';",
    "var btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:6px;margin-bottom:7px';",
    
    "var capBtn=document.createElement('button');capBtn.id='__aiCap';",
    "capBtn.textContent='화면 캡쳐 후 풀기';",
    "capBtn.style.cssText='flex:1;padding:9px;background:#111;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit';",
    
    "var upBtn=document.createElement('button');upBtn.id='__aiUpBtn';",
    "upBtn.textContent='파일 업로드';",
    "upBtn.style.cssText='flex:1;padding:9px;background:#f4f4f5;color:#222;border:1px solid #e4e4e7;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit';",
    
    "var fileInp=document.createElement('input');fileInp.type='file';fileInp.accept='image/*';fileInp.style.display='none';",
    "btnRow.appendChild(capBtn);btnRow.appendChild(upBtn);btnRow.appendChild(fileInp);ft.appendChild(btnRow);",

    "var row=document.createElement('div');row.style.cssText='display:flex;gap:5px';",
    "var ta=document.createElement('textarea');ta.id='__aiQ';ta.rows=2;ta.placeholder='질문 입력 (Enter 전송)';",
    "ta.style.cssText='flex:1;padding:7px 10px;background:#fff;border:1px solid #e5e5e5;border-radius:7px;color:#111;font-size:13px;outline:none;resize:none;font-family:inherit;line-height:1.5';",
    "var sdBtn=document.createElement('button');sdBtn.id='__aiSd';sdBtn.textContent='전송';",
    "sdBtn.style.cssText='padding:7px 12px;background:#111;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;align-self:flex-end;font-family:inherit';",
    "row.appendChild(ta);row.appendChild(sdBtn);ft.appendChild(row);pn.appendChild(ft);",

    "function addMsg(r,t,noSave){",
      "var d=document.createElement('div');",
      "d.style.cssText='padding:8px 11px;border-radius:8px;line-height:1.65;white-space:pre-wrap;word-break:break-word;font-size:13px;background='+(r==='u'?'#f0f6ff':'#f7f7f7')+';color:#111;';",
      "d.textContent=t;",
      "var l=document.getElementById('__aiLg');if(l){l.appendChild(d);l.scrollTop=l.scrollHeight;}",
      "if(!noSave && r==='u' && typeof t === 'string'){ H.push({r:r,c:t}); syncHist(); }",
      "return d;",
    "}",
    
    "function syncHist(){ try{ localStorage.setItem('__ai_hist_'+M, JSON.stringify(H)); }catch(e){} }",

    "if(H.length > 0){",
      "H.forEach(function(h){",
        "if(typeof h.c === 'string') { addMsg(h.r, h.c, true); }",
        "else { addMsg(h.r, h.r==='u'?'[이미지 질문]':'[이미지 답변]', true); }",
      "});",
    "} else {",
      "addMsg('a', '화면 캡쳐나 파일 업로드 버튼을 누르거나 직접 질문하세요.', true);",
    "}",

    "function callAPI(msgs,box,done){",
      "var isG=P==='gemini';",
      "var url=isG?('https://generativelanguage.googleapis.com/v1beta/models/'+M+':streamGenerateContent?key='+K+'&alt=sse'):'https://api.openai.com/v1/chat/completions';",
      "var hdrs={'Content-Type':'application/json'};if(!isG)hdrs['Authorization']='Bearer '+K;",
      "var body;",
      "if(isG){",
        "var cs=[];msgs.forEach(function(m){cs.push({role:m.r==='u'?'user':'model',parts:Array.isArray(m.c)?m.c:[{text:m.c}]});});",
        "body=JSON.stringify({system_instruction:{parts:[{text:SYS}]},contents:cs,generationConfig:{maxOutputTokens:2000}});",
      "}else{",
        "var ms=[{role:'system',content:SYS}];msgs.forEach(function(m){ms.push({role:m.r==='u'?'user':'assistant',content:Array.isArray(m.c)?m.c:m.c});});",
        "body=JSON.stringify({model:M,messages:ms,max_tokens:2000,stream:true});",
      "}",
      "fetch(url,{method:'POST',headers:hdrs,body:body})",
      ".then(function(res){",
        "var rd=res.body.getReader(),dc=new TextDecoder(),buf='',acc='';",
        "function pump(){rd.read().then(function(r){",
          "if(r.done){done(acc);return;}",
          "buf+=dc.decode(r.value,{stream:true});",
          "var lines=buf.split('\\n');buf=lines.pop();",
          "lines.forEach(function(ln){",
            "if(!ln.startsWith('data:'))return;",
            "var dt=ln.slice(5).trim();if(dt==='[DONE]')return;",
            "try{var j=JSON.parse(dt);",
              "var t=isG?(j.candidates&&j.candidates[0].content.parts[0].text):(j.choices&&j.choices[0].delta.content);",
              "if(t){acc+=t;box.textContent=acc;var l=document.getElementById('__aiLg');if(l)l.scrollTop=l.scrollHeight;}",
            "}catch(e){}",
          "});pump();",
        "}).catch(function(){done(acc);});}pump();",
      "})",
      ".catch(function(e){box.textContent='오류: '+e.message;done('');});",
    "}",

    "function ask(msgs){",
      "var box=addMsg('a','생각 중...', true);box.style.color='#aaa';",
      "var cap=document.getElementById('__aiCap'),sd=document.getElementById('__aiSd'),up=document.getElementById('__aiUpBtn');",
      "if(cap)cap.disabled=true;if(sd)sd.disabled=true;if(up)up.disabled=true;",
      "callAPI(msgs,box,function(ans){",
        "box.style.color='#111';H.push({r:'a',c:ans});syncHist();",
        "if(cap){cap.disabled=false;cap.textContent='화면 캡쳐 후 풀기';}",
        "if(sd)sd.disabled=false;if(up)up.disabled=false;",
      "});",
    "}",

    "function processImg(b64, msgTitle){",
      "addMsg('u',msgTitle, true);",
      "var txt='이 이미지의 문제를 풀어주세요.';",
      "var um=P==='gemini'",
        '?{r:\'u\',c:[{inlineData:{mimeType:\'image/jpeg\',data:b64}},{text:txt}]}',
        ':{r:\'u\',c:[{type:\'image_url\',image_url:{url:\'data:image/jpeg;base64,\'+b64}},{type:\'text\',text:txt}]};',
      "H.push(um);syncHist();ask(H);",
    "}",

    "function loadJs(src,cb){var s=document.createElement('script');s.src=src;s.onload=cb;document.head.appendChild(s);}",
    "xBtn.onclick=function(){pn.style.transform='translateX(100%)';setTimeout(function(){pn.remove();window.__aiOn=false;},300);};",
    
    "rstBtn.onclick=function(){if(confirm('대화 내용을 전부 삭제하시겠습니까?')){H=[];syncHist();var l=document.getElementById('__aiLg');if(l)l.innerHTML='';addMsg('a','대화가 초기화되었습니다.',true);}}; ",

    "capBtn.onclick=function(){",
      "capBtn.disabled=true;capBtn.textContent='캡쳐 중...';pn.style.display='none';",
      "loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',function(){",
        "html2canvas(document.body,{useCORS:true,scale:1.5,logging:false,allowTaint:true})",
        ".then(function(canvas){",
          "pn.style.display='flex';",
          "var b64=canvas.toDataURL('image/jpeg',0.82).split(',')[1];",
          "processImg(b64, '[화면 캡쳐]');",
        "})",
        ".catch(function(e){pn.style.display='flex';capBtn.disabled=false;capBtn.textContent='화면 캡쳐 후 풀기';addMsg('a','캡쳐 실패: '+e.message, true);});",
      "});",
    "};",
    
    "upBtn.onclick=function(){ fileInp.click(); };",
    "fileInp.onchange=function(e){",
      "var file=e.target.files[0];if(!file)return;",
      "var reader=new FileReader();",
      "reader.onload=function(evt){",
        "var b64=evt.target.result.split(',')[1];",
        "processImg(b64, '[파일 업로드: '+file.name+']');",
        "fileInp.value='';",
      "};",
      "reader.readAsDataURL(file);",
    "};",

    "sdBtn.onclick=function(){var q=ta.value.trim();if(!q)return;ta.value='';addMsg('u',q);ask(H);};",
    "ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sdBtn.onclick();}});",
  ].join("");

  return "javascript:(function(){"+encodeURIComponent(src)+"})()";
}

// 초기화
(function(){
  renderModels();
  renderStyles();
  var inp = document.getElementById("ki");
  inp.value = savedKeys[selModel] || "";
  updateKS();
  inp.addEventListener("input", function(){
    savedKeys[selModel] = this.value.trim();
    saveKeys();
    updateKS();
  });
  inp.addEventListener("keydown", function(e){ if(e.key==="Enter") generate(); });
})();
</script>
</body>
</html>
